 <h1>Gallery</h1>

 <h2></h2>

 <p>Please press a button to choose a topical set of images. </p>
<is-land on:visible>
  <div id="gallery" v-scope="{ active: 'none' }">
    <section class="pushButton">
      <button @click="active = 'all'">all</button>
      
        <button @click="active = 'animals'">animals</button>
      
        <button @click="active = 'music'">music</button>
      
        <button @click="active = 'tech'">tech</button>
      
    </section>

    
      <section class="gallery animals" v-show="active === 'all' || active === 'animals'">
        <h2>animals</h2>
        <div class="flex">
          
            <figure>
              <img src="img/animals/newt-mosaic4.png" alt="newt-mosaic4">
              <figcaption>newt-mosaic4</figcaption>
            </figure>
          
            <figure>
              <img src="img/animals/puffin-habitat.jpg" alt="puffin-habitat">
              <figcaption>puffin-habitat</figcaption>
            </figure>
          
            <figure>
              <img src="img/animals/puffin1.jpg" alt="puffin1">
              <figcaption>puffin1</figcaption>
            </figure>
          
            <figure>
              <img src="img/animals/xpath-rabbit.png" alt="xpath-rabbit">
              <figcaption>xpath-rabbit</figcaption>
            </figure>
          
        </div>
      </section>
    
      <section class="gallery music" v-show="active === 'all' || active === 'music'">
        <h2>music</h2>
        <div class="flex">
          
            <figure>
              <img src="img/music/bagpipe.png" alt="bagpipe">
              <figcaption>bagpipe</figcaption>
            </figure>
          
            <figure>
              <img src="img/music/pan-flute.jpg" alt="pan-flute">
              <figcaption>pan-flute</figcaption>
            </figure>
          
            <figure>
              <img src="img/music/piano-keys.jpg" alt="piano-keys">
              <figcaption>piano-keys</figcaption>
            </figure>
          
        </div>
      </section>
    
      <section class="gallery tech" v-show="active === 'all' || active === 'tech'">
        <h2>tech</h2>
        <div class="flex">
          
            <figure>
              <img src="img/tech/DIGIT-fingerprint.png" alt="DIGIT-fingerprint">
              <figcaption>DIGIT-fingerprint</figcaption>
            </figure>
          
            <figure>
              <img src="img/tech/circuitHeart.jpg" alt="circuitHeart">
              <figcaption>circuitHeart</figcaption>
            </figure>
          
            <figure>
              <img src="img/tech/pebbleWatch.png" alt="pebbleWatch">
              <figcaption>pebbleWatch</figcaption>
            </figure>
          
        </div>
      </section>
    
  </div>

  <template data-island>
    <script type="module">
      import { createApp } from 'https://unpkg.com/petite-vue?module'
      createApp().mount('#gallery')
    </script>
  </template>
</is-land>
