         <is-land on:visible>
    <!-- Fallback text shown before JS runs or if JS is disabled -->
    <span id="footer-datetime"></span>

    <template data-island>
      <script type="module">
        const el = document.getElementById("footer-datetime");
        const now = new Date();

        // Format date and time cleanly using the locale set on my computer:
        el.textContent = new Intl.DateTimeFormat(undefined, {
          dateStyle: "medium",
          timeStyle: "short"
        }).format(now);

        // Set the semantic datetime attribute
        el.setAttribute("datetime", now.toISOString());
      </script>
    </template>
